name: Native Nuvio Max'd checks
on:
  push:
    paths:
      - 'native-app/**'
      - '.github/workflows/native-checks.yml'
  pull_request:
    paths:
      - 'native-app/**'
      - '.github/workflows/native-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-and-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          if ! pkg-config --exists libcurl openssl libavcodec libavutil libavformat libswscale libswresample libass egl gl || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo apt-get install -y libcurl4-openssl-dev libssl-dev libavcodec-dev libavutil-dev libavformat-dev libswscale-dev libswresample-dev libass-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri pkg-config openssl ffmpeg
          fi
      - name: Test account, catalogs, stream cards, navigation, decoder setup and GPU video
        run: bash native-app/tests/run.sh
      - name: Render controller dialogs and update guidance
        run: bash native-app/tests/preview.sh
      - name: Check whitespace
        run: git diff --check
  vlc-playback:
    runs-on: ubuntu-latest
    # Match the tested 3.0.23 host ABI, close to the PS5 target's 3.0.24.
    # Ubuntu 24.04 still supplies 3.0.20 with older adaptive seek behavior.
    container: debian:trixie
    timeout-minutes: 10
    steps:
      - name: Install real VLC and codec development libraries
        run: |
          apt-get update -qq
          apt-get install -y git ca-certificates python3 g++ pkg-config ffmpeg libcurl4-openssl-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libvlc-dev libvlccore-dev vlc-plugin-base
      - uses: actions/checkout@v4
      - name: Test VLC file playback, authenticated HTTP/HLS, seeking and cancellation
        run: bash native-app/tests/vlc_host.sh
