name: Issue 14 media-server regressions
on:
  push:
    branches: ['fix/issue-14-media-art-and-persistence']
  pull_request:
    paths:
      - 'source/native-app/gl/art.cpp'
      - 'source/native-app/gl/session_media_servers.cpp'
      - 'source/native-app/src/iptv_library.*'
      - 'source/native-app/tests/media_session*'
      - '.github/workflows/issue14-media-regressions.yml'
permissions:
  contents: read
jobs:
  media-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - name: Install regression-test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ pkg-config python3 libcurl4-openssl-dev libssl-dev libgl-dev libegl-dev
      - name: Authenticated artwork and bounded cache
        run: bash native-app/tests/artwork_queue.sh
      - name: New-session persistence, profile isolation and metadata failure
        run: bash native-app/tests/media_session.sh
      - name: Existing private IPTV catalogs
        run: bash native-app/tests/iptv_library.sh
      - name: Password keyboard masking regression
        run: bash native-app/tests/ime_secret.sh
